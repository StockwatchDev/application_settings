# Config for the secrets example

# A value that is entirely '${env:NAME}' is taken from the environment variable NAME.
# The text after the comma is used if the variable is not set.
name = "${env:EXAMPLE_APP_NAME,secrets example}"

# The value is converted to the type of the parameter, here an int
port = "${env:EXAMPLE_PORT,8080}"

# Not set in the environment but in the file example.env, see below
api_key = "${env:EXAMPLE_API_KEY}"

[database]
host = "db.example.org"

# A value that is entirely '${file:NAME}' is the content of the file NAME in the secrets folder
password = "${file:db_password}"

[application_config]
config_container_class = "app_config.SecretsExampleConfig"

# In strict mode, a secret that does not come from a reference is an error
strict_mode = true

# Where the variables for '${env:...}' are read from, besides the real environment.
# A relative path is relative to the folder of this file.
dotenv_file = "example.env"

# The folder with the files for '${file:...}'
secrets_dir = "secret_files"
